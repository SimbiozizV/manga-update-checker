name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'yarn'

      - name: Install project
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint:all

  build:
    needs: [lint]
    runs-on: ubuntu-latest
    if: always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'yarn'

      - name: Install project
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build
